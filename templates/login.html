<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DITTO DINKY CASINO</title>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-card: #1a1f3a;
            --bg-elevated: #232946;
            --text-primary: #ffffff;
            --text-secondary: #b8c1ec;
            --accent-primary: #00d4aa;
            --accent-gold: #fbbf24;
            --accent-danger: #ef4444;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary), #1a1f3a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        form {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-elevated);
            border: 2px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.2);
        }

        input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-primary), #00a389);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 170, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .footer-links {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .footer-links a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid var(--accent-danger);
            color: var(--accent-danger);
            padding: 14px 18px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            form {
                padding: 32px 24px;
            }

            h1 {
                font-size: 30px;
            }

            .logo {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎰</div>
            <h1>DITTO DINKY</h1>
            <p class="subtitle">Welcome back! Ready to win?</p>
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input name="username" id="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input name="password" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit">🎯 Login</button>

            {% if error %}
                <div class="error-message">
                    ❌ {{ error }}
                </div>
            {% endif %}
        </form>

        <p class="footer-links">
            Don't have an account? <a href="/register">Create one now</a>
        </p>
    </div>
</body>
</html>
