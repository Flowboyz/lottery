{% extends "base.html" %}
{% block title %}Register - DITTO DINKY{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">DITTO DINKY</h2>
        <p class="auth-subtitle">Join us and start winning today!</p>

        <form method="post" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input name="username" id="username" placeholder="Choose a username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email (optional)</label>
                <input name="email" id="email" type="email" placeholder="your@email.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input name="password" type="password" id="password" placeholder="Min 6 characters" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="password2">Confirm Password</label>
                <input name="password2" type="password" id="password2" placeholder="Re-enter your password" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="referral_code">Referral Code (optional)</label>
                <input name="referral_code" id="referral_code" placeholder="Got a referral code?"
                       value="{{ request.args.get('ref', '') }}" autocomplete="off">
            </div>

            <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">Already have an account? Login here</a>
        </div>
    </div>
</div>
{% endblock %}
