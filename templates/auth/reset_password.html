{% extends "base.html" %}
{% block title %}Reset Password - DITTO DINKY{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Enter the OTP sent to your email and choose a new password.</p>
        <form method="POST" action="{{ url_for('auth.reset_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group">
                <label for="otp">OTP Code</label>
                <input type="text" name="otp" id="otp" required placeholder="6-digit code" maxlength="6">
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" name="password" id="password" required placeholder="Min 8 characters" minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required placeholder="Repeat password">
            </div>
            <button type="submit" class="auth-btn">Reset Password</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
