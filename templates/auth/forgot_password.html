{% extends "base.html" %}
{% block title %}Forgot Password - DITTO DINKY{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Forgot Password</h2>
        <p class="auth-subtitle">Enter your email to receive a reset code.</p>
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="you@example.com">
            </div>
            <button type="submit" class="auth-btn">Send Reset Code</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
