{% extends "base.html" %}
{% block title %}Admin Verification - DITTO DINKY{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Admin Verification</h2>
        <p class="auth-subtitle">Enter the 6-digit code sent to your email to continue.</p>
        <form method="POST" action="{{ url_for('auth.admin_2fa') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="otp">Verification Code</label>
                <input type="text" name="otp" id="otp" required placeholder="6-digit code"
                       maxlength="6" pattern="[0-9]{6}" class="form-input"
                       style="text-align:center;font-size:24px;letter-spacing:8px;font-weight:700;">
            </div>
            <button type="submit" class="auth-btn">Verify & Login</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
